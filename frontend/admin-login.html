<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Consistency Tracker</title>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #facc15;
      --black: #0a0a0a;
      --white: #ffffff;
      --blue: #60a5fa;
      --pink: #f472b6;
      --border: 3px solid #0a0a0a;
      --shadow: 8px 8px 0px #0a0a0a;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f0f0;
      background-image: radial-gradient(var(--black) 1px, transparent 1px);
      background-size: 30px 30px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Floating Decorative Shapes */
    .shape {
      position: absolute;
      z-index: 0;
      border: var(--border);
      box-shadow: 6px 6px 0 var(--black);
    }
    .shape-1 { width: 100px; height: 100px; background: var(--yellow); top: 10%; left: 10%; transform: rotate(15deg); }
    .shape-2 { width: 150px; height: 150px; background: var(--blue); bottom: 15%; right: 10%; border-radius: 50%; }
    .shape-3 { width: 80px; height: 80px; background: var(--pink); top: 20%; right: 20%; transform: rotate(-20deg); }
    .shape-4 { width: 120px; height: 60px; background: #4ade80; bottom: 20%; left: 15%; transform: skew(10deg); }

    .login-card {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 48px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: -1px;
      border-left: 10px solid var(--yellow);
      padding-left: 15px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border: var(--border);
      font-family: inherit;
      font-size: 16px;
      outline: none;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
    }

    input:focus {
      background: #fdf2f2;
      box-shadow: 4px 4px 0 var(--yellow);
    }

    #togglePassword,
    #toggleOtp {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      width: 24px;
      height: 24px;
      z-index: 2;
    }

    #togglePassword svg,
    #toggleOtp svg {
      width: 20px;
      height: 20px;
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      background: var(--black);
      color: var(--white);
      border: none;
      font-family: inherit;
      font-weight: 900;
      font-size: 18px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login svg,
    .btn-login i {
      display: inline-flex;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn-login:hover {
      background: var(--yellow);
      color: var(--black);
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0 var(--black);
    }

    .back-home {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      font-weight: 800;
      text-decoration: none;
      color: var(--black);
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--black);
      width: fit-content;
      margin: 0 auto;
    }

    .back-home svg,
    .back-home i {
      display: inline-flex;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .back-home:hover {
      background: var(--pink);
    }

    .error-msg {
      background: #fee2e2;
      border: 2px solid #ef4444;
      padding: 12px;
      margin-bottom: 20px;
      font-weight: 700;
      color: #b91c1c;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Decorative Background Shapes -->
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
  <div class="shape shape-4"></div>

  <div class="login-card">
    <h1>Admin Login</h1>
    <div id="error-msg" class="error-msg"></div>
    <form id="login-form">
      <div id="credentials-step">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" required placeholder="••••••••" style="padding-right: 45px;">
            <button type="button" id="togglePassword" title="Toggle Password visibility" aria-label="Toggle Password visibility">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <button type="button" id="btn-continue" class="btn-login">Continue <i data-lucide="arrow-right"></i></button>
      </div>

      <div id="otp-step" style="display: none;">
        <div class="form-group" style="margin-bottom: 8px;">
          <label for="otp">Verification Code</label>
          <div style="position: relative;">
            <input type="password" id="otp" placeholder="••••••" maxlength="10" autocomplete="one-time-code" style="text-align: center; font-size: 24px; letter-spacing: 6px; font-weight: 900; padding-right: 45px; padding-left: 45px;">
            <button type="button" id="toggleOtp" title="Toggle OTP visibility" aria-label="Toggle OTP visibility">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12px; min-height: 20px;">
          <button type="button" id="btn-send-email-otp" onclick="handleSendEmailOtp()" style="background: none; border: none; color: var(--black); font-weight: 800; cursor: pointer; text-decoration: underline; padding: 0; display: inline-flex; align-items: center; gap: 5px; font-family: inherit;">
            <i data-lucide="mail" style="width:14px; height:14px;"></i> Send OTP to Email
          </button>
          <span id="otp-sent-status" style="font-size: 11px; font-weight: 800; color: #15803d; display: none;">✓ Code sent to email!</span>
        </div>

        <button type="submit" id="btn-verify-otp" class="btn-login">Verify &amp; Login <i data-lucide="shield-check"></i></button>
        <button type="button" onclick="resetLogin()" style="background: none; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 12px; width: 100%; margin-bottom: 20px;">← Back to Credentials</button>
      </div>

      <a href="landing.html" class="back-home"><i data-lucide="arrow-left"></i> Back to home</a>
    </form>
  </div>

  <script src="libs/lucide.min.js"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="/js/libs/lucide/lucide.min.js"><\/script>');
    }
  </script>
  <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleOtp = document.getElementById('toggleOtp');
    const otpInput = document.getElementById('otp');
    const emailInput = document.getElementById('email');
    const errorEl = document.getElementById('error-msg');
    
    const credentialsStep = document.getElementById('credentials-step');
    const otpStep = document.getElementById('otp-step');
    const btnContinue = document.getElementById('btn-continue');
    const btnVerifyOtp = document.getElementById('btn-verify-otp');
    const btnSendEmailOtp = document.getElementById('btn-send-email-otp');
    const otpSentStatus = document.getElementById('otp-sent-status');

    function initIcons(root) {
      if (window.lucide && typeof lucide.createIcons === 'function') {
        if (root) lucide.createIcons({ root });
        else lucide.createIcons();
      }
    }

    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.innerHTML = type === 'password' ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
      initIcons(this);
    });

    if (toggleOtp) {
      toggleOtp.addEventListener('click', function () {
        const type = otpInput.getAttribute('type') === 'password' ? 'text' : 'password';
        otpInput.setAttribute('type', type);
        this.innerHTML = type === 'password' ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
        initIcons(this);
      });
    }

    // Initial icons
    initIcons();
    window.addEventListener('DOMContentLoaded', () => initIcons());

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function resetLogin() {
      credentialsStep.style.display = 'block';
      otpStep.style.display = 'none';
      errorEl.style.display = 'none';
      otpInput.value = '';
      otpInput.setAttribute('type', 'password');
      if (otpSentStatus) otpSentStatus.style.display = 'none';
      if (toggleOtp) {
        toggleOtp.innerHTML = '<i data-lucide="eye"></i>';
        initIcons(toggleOtp);
      }
      passwordInput.focus();
    }

    async function handleContinue() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      
      if (!email || !password) {
        return showError('Please enter both email and password.');
      }

      btnContinue.disabled = true;
      btnContinue.innerHTML = 'Verifying... <i data-lucide="arrow-right"></i>';
      initIcons(btnContinue);
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/admin/verify-credentials', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          credentialsStep.style.display = 'none';
          otpStep.style.display = 'block';
          otpInput.value = '';
          otpInput.setAttribute('type', 'password');
          if (otpSentStatus) otpSentStatus.style.display = 'none';
          if (toggleOtp) {
            toggleOtp.innerHTML = '<i data-lucide="eye"></i>';
            initIcons(toggleOtp);
          }
          setTimeout(() => otpInput.focus(), 100);
        } else {
          showError(data.message || 'Verification failed');
        }
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        btnContinue.disabled = false;
        btnContinue.innerHTML = 'Continue <i data-lucide="arrow-right"></i>';
        initIcons(btnContinue);
      }
    }

    async function handleSendEmailOtp() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        return showError('Missing credentials. Please return to step 1.');
      }

      if (btnSendEmailOtp) {
        btnSendEmailOtp.disabled = true;
        btnSendEmailOtp.innerHTML = '<i data-lucide="loader" style="width:14px;height:14px;"></i> Sending OTP...';
        initIcons(btnSendEmailOtp);
      }
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/admin/request-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          if (otpSentStatus) {
            otpSentStatus.textContent = '✓ Code sent to email!';
            otpSentStatus.style.display = 'inline';
          }
        } else {
          showError(data.message || 'Failed to send verification code.');
        }
      } catch (err) {
        showError('Network error. Failed to send OTP.');
      } finally {
        if (btnSendEmailOtp) {
          btnSendEmailOtp.disabled = false;
          btnSendEmailOtp.innerHTML = '<i data-lucide="mail" style="width:14px;height:14px;"></i> Resend OTP to Email';
          initIcons(btnSendEmailOtp);
        }
      }
    }

    async function handleVerifyOtp() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const otp = otpInput.value.trim();

      if (!otp) return showError('Please enter the verification code.');

      if (btnVerifyOtp) {
        btnVerifyOtp.disabled = true;
        btnVerifyOtp.innerHTML = 'Verifying... <i data-lucide="shield-check"></i>';
        initIcons(btnVerifyOtp);
      }

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, otp })
        });
        const data = await res.json();

        if (res.ok) {
          // Cross-tab protection: Clear user token if logging in as admin
          localStorage.removeItem('token');
          localStorage.setItem('adminToken', data.token);
          window.location.replace('admin-dashboard.html');
        } else {
          showError(data.message || 'Login failed');
          if (btnVerifyOtp) {
            btnVerifyOtp.disabled = false;
            btnVerifyOtp.innerHTML = 'Verify &amp; Login <i data-lucide="shield-check"></i>';
            initIcons(btnVerifyOtp);
          }
        }
      } catch (err) {
        showError('Network error. Please try again.');
        if (btnVerifyOtp) {
          btnVerifyOtp.disabled = false;
          btnVerifyOtp.innerHTML = 'Verify &amp; Login <i data-lucide="shield-check"></i>';
          initIcons(btnVerifyOtp);
        }
      }
    }

    btnContinue.addEventListener('click', (e) => {
      e.preventDefault();
      handleContinue();
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      // If credentials step is currently active, Enter should trigger Continue
      if (otpStep.style.display === 'none') {
        await handleContinue();
      } else {
        await handleVerifyOtp();
      }
    });

    // Cross-tab monitoring: If a user logs in elsewhere, we stay as we are (login page)
    // But if we are ALREADY logged in as admin, we handle it in the dashboard.
    
    // Already logged in?
    if (localStorage.getItem('adminToken')) {
      window.location.replace('admin-dashboard.html');
    }

    // Handle browser back button / caching
    window.onpageshow = function(event) {
      if (localStorage.getItem('adminToken')) {
        window.location.replace('admin-dashboard.html');
      }
    };

    // Listen for storage events (e.g. if another tab logs out admin)
    window.addEventListener('storage', (e) => {
      if (e.key === 'adminToken' && !e.newValue) {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
